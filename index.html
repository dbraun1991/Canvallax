<!doctype html>
<html lang="en">
  <head>
    <script>
      // Applied synchronously, before first paint, so there's no flash of
      // the wrong theme while Alpine is still loading (ADR-0013/0020).
      (function () {
        try {
          var saved = localStorage.getItem('canvallax_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvallax</title>
  </head>
  <body>
    <div id="app" x-data="shell()" x-cloak>
      <div class="loading-state" x-show="loading">
        <p x-text="t('shell.loading')"></p>
      </div>
      <div class="shell" x-show="!loading">
        <!-- Top brand bar (ADR-0017) — always visible, not gated on activeIssue:
             this is the one piece of chrome that has to work before any Issue
             is picked, since the burger menu is how the Issue-picker overlay
             (below) gets reopened once an Issue is already active. -->
        <header class="top-bar">
          <div class="top-bar-left">
            <button
              type="button"
              class="burger-button"
              @click="toggleBurgerMenu()"
              :title="t('topBar.menu')"
              :aria-label="t('topBar.menu')"
            >
              ☰
            </button>
            <span class="brand-wordmark">Canvallax</span>
          </div>

          <!-- Issue name/status + the view-switcher, centered in the full bar
               width (not just the space left of the burger) via .top-bar's
               1fr/auto/1fr grid tracks — a plain flex row would center this
               relative to the leftover space next to .top-bar-left instead. -->
          <div class="top-bar-center" x-show="activeIssue">
            <template x-if="activeIssue">
              <!-- The trailing divider only makes sense next to the tab switcher
                   (canvas-tabs, below) — in Presenting mode that's hidden, so the
                   divider would otherwise dangle with nothing after it. -->
              <div class="issue-header" :class="{ 'issue-header-divided': canvasMode === 'editing' }">
                <input
                  type="text"
                  class="issue-name-field"
                  x-model="activeIssue.name"
                  @input="saveActiveIssue()"
                  :placeholder="t('topBar.issueNamePlaceholder')"
                  :title="activeIssue.name"
                />
                <select
                  class="issue-status-field issue-state"
                  :class="'state-' + activeIssue.status"
                  x-model="activeIssue.status"
                  @change="saveActiveIssue()"
                >
                  <option value="open" x-text="t('status.open')"></option>
                  <option value="mapped" x-text="t('status.mapped')"></option>
                  <option value="decided" x-text="t('status.decided')"></option>
                </select>
              </div>
            </template>
            <!-- ADR-0018: Editing mode's active-tab structure, replacing the old
                 plain view-switcher buttons. Hidden entirely in Presenting mode —
                 there's nothing to switch between beyond the grid and a zoomed tile. -->
            <div class="canvas-tabs" x-show="canvasMode === 'editing'">
              <template x-for="view in ['all', 'process', 'system', 'object', 'interaction']" :key="view">
                <button
                  type="button"
                  class="canvas-tab"
                  :class="{ active: activeView === view }"
                  @click="setView(view)"
                  x-text="t('canvas.' + view)"
                ></button>
              </template>
            </div>
          </div>

          <div class="top-bar-right" x-show="activeIssue">
            <div class="view-tabs-actions" x-show="activeView !== 'all'">
              <button type="button" class="copy-toggle" @click="openCopyPicker('view')" x-text="t('topBar.copy')"></button>
              <button type="button" class="history-toggle" @click="toggleHistory()" x-text="t('topBar.history')"></button>
              <button type="button" class="export-toggle" @click="openExportPicker()" x-text="t('topBar.export')"></button>
              <button type="button" class="howto-toggle" @click="openHowTo(activeView)" x-text="t('topBar.howTo')"></button>
            </div>
          </div>
        </header>

        <!-- Burger menu: a small anchored dropdown, not a dimmed modal (ADR-0017) -->
        <div class="burger-menu-backdrop" x-show="burgerMenuOpen" @click="closeBurgerMenu()" x-cloak></div>
        <div class="burger-menu" x-show="burgerMenuOpen" x-cloak>
          <button type="button" class="burger-menu-item" @click="openIssuePicker()">
            <svg class="menu-icon" viewBox="0 0 24 24">
              <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z" />
            </svg>
            <span x-text="t('burgerMenu.changeIssue')"></span>
          </button>
          <button type="button" class="burger-menu-item" @click="toggleTheme(); closeBurgerMenu()">
            <!-- Icon pair borrowed from another project in this workspace's own
                 theme toggle: shows the icon matching the CURRENT theme (moon
                 while dark, sun while light), not the destination. -->
            <svg class="menu-icon" viewBox="0 0 24 24" x-show="theme === 'dark'">
              <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" />
            </svg>
            <svg class="menu-icon" viewBox="0 0 24 24" x-show="theme !== 'dark'" x-cloak>
              <path
                d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"
              />
            </svg>
            <span x-text="theme === 'dark' ? t('burgerMenu.lightMode') : t('burgerMenu.darkMode')"></span>
          </button>
          <!-- ADR-0027: language item opens a flyout to the right on hover
               (not a <select>, not click) listing each language with its
               own flag — flags borrowed from a sibling project's convention
               (plain Unicode emoji, no image/SVG assets). Language names
               are each language's own endonym, never run through t(). -->
          <div class="burger-menu-language-wrap" @mouseenter="openLanguageMenu()" @mouseleave="closeLanguageMenu()">
            <button type="button" class="burger-menu-item">
              <span class="menu-flag" x-text="$store.i18n.languages[$store.i18n.language].flag"></span>
              <span x-text="t('burgerMenu.language')"></span>
              <span class="burger-menu-caret" aria-hidden="true">&rsaquo;</span>
            </button>
            <div class="language-flyout" x-show="languageMenuOpen" x-cloak>
              <template x-for="code in $store.i18n.supported" :key="code">
                <button
                  type="button"
                  class="language-flyout-item"
                  :class="{ active: code === $store.i18n.language }"
                  @click="selectLanguage(code)"
                >
                  <span class="menu-flag" x-text="$store.i18n.languages[code].flag"></span>
                  <span x-text="$store.i18n.languages[code].name"></span>
                </button>
              </template>
            </div>
          </div>
          <button type="button" class="burger-menu-item" @click="openSettings()" x-text="t('burgerMenu.settings')"></button>
          <button type="button" class="burger-menu-item" @click="openHowTo()" x-text="t('burgerMenu.howTo')"></button>
        </div>

        <div class="shell-columns">
          <!-- Backlog panel (ADR-0017): now the shell's only side panel, moved
               to the left in the old Issue sidebar's place — it covers the
               whole Issue, not one canvas, so it belongs where the eye lands
               first. -->
          <aside
            class="backlog-panel"
            x-show="activeIssue"
            :class="{ collapsed: !backlogExpanded }"
            :style="backlogExpanded ? `width: ${backlogWidth}px` : ''"
          >
            <div
              class="resize-handle resize-handle-right"
              :class="{ resizing: resizingBacklog }"
              @mousedown="startBacklogResize($event)"
            ></div>
            <div class="backlog-body" x-show="backlogExpanded" x-cloak>
              <template x-if="activeIssue">
                <div class="backlog-entries">
                  <div class="backlog-entries-header">
                    <h3 x-text="t('backlog.title')"></h3>
                    <button type="button" class="copy-toggle" @click="openCopyPicker('entry')" x-text="t('backlog.copyEntryFrom')"></button>
                  </div>
                  <div class="add-entry-form">
                    <input
                      type="text"
                      class="backlog-field"
                      x-model="newEntryName"
                      @keydown.enter="addEntry()"
                      :placeholder="t('backlog.newEntryPlaceholder')"
                    />
                    <button type="button" class="add-entry-button" @click="addEntry()" x-text="t('backlog.add')"></button>
                  </div>
                  <ul class="backlog-entry-list">
                    <template x-for="entry in activeIssue.backlogEntries" :key="entry.id">
                      <li class="backlog-entry">
                        <div class="backlog-entry-header">
                          <input
                            type="text"
                            class="backlog-field backlog-entry-name-field"
                            x-model="entry.name"
                            @input="saveActiveIssue()"
                            :title="entry.name"
                          />
                          <button type="button" class="backlog-entry-delete" @click="deleteEntry(entry.id)">×</button>
                        </div>
                        <textarea
                          class="backlog-field backlog-entry-description-field"
                          x-model="entry.description"
                          @input="saveActiveIssue()"
                          :placeholder="t('backlog.descriptionPlaceholder')"
                          :title="entry.description"
                        ></textarea>
                        <p class="copy-provenance" x-show="entry.copiedFrom" :title="copyProvenanceLabel(entry.copiedFrom)" x-text="t('backlog.copiedFromAnotherIssue')"></p>
                      </li>
                    </template>
                    <li class="backlog-empty" x-show="activeIssue.backlogEntries.length === 0" x-text="t('backlog.noEntriesYet')"></li>
                  </ul>
                </div>
              </template>
            </div>
            <!-- ADR-0018: Presenting/Editing mode toggle, in the Backlog panel's
                 footer now that it's the shell's only side panel. -->
            <div class="backlog-footer" x-show="backlogExpanded" x-cloak>
              <span class="mode-toggle-label" x-text="canvasMode === 'editing' ? t('backlog.editing') : t('backlog.presenting')"></span>
              <label class="toggle-switch" :title="t('backlog.modeToggleTitle')">
                <input type="checkbox" :checked="canvasMode === 'presenting'" @change="toggleCanvasMode()" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </aside>

          <main class="view-switcher" x-show="activeIssue">
            <div class="view-content">
              <template x-if="activeView === 'all'">
                <!-- ADR-0019/0033: :style drives the container's grid-template-*
                     between a plain 2x2 and a featured layout — each cell's own
                     grid-area is static (CSS, keyed by data-view below), only
                     the container's template changes. An in-place reflow, not an
                     overlay, so the Backlog panel stays interactive throughout.
                     ADR-0033: the featured view renders in its own separate
                     .all-featured-display element below, not by resizing one of
                     the four tiles — they stay in fixed Process/System/Object/
                     Interaction order always, never reordered or excluded; the
                     featured one just dims in place (:class="dimmed"). -->
                <div class="all-grid" :style="allGridStyle" x-effect="renderAllThumbnails()">
                  <div
                    class="all-cell all-featured-display"
                    x-show="featuredCanvas"
                    x-cloak
                    :data-featured-view="featuredCanvas"
                    @click="toggleZoom(featuredCanvas)"
                  >
                    <h3 x-text="featuredCanvasLabel"></h3>
                    <div class="all-cell-thumbnail" x-show="thumbnails[featuredCanvas]" x-html="thumbnails[featuredCanvas]"></div>
                    <p
                      class="placeholder"
                      x-show="featuredCanvas !== 'interaction' && !thumbnails[featuredCanvas]"
                      x-text="t('allGrid.rendering')"
                    ></p>
                    <p
                      class="placeholder"
                      x-show="featuredCanvas === 'interaction' && thumbnails.interaction === null"
                      x-text="t('allGrid.rendering')"
                    ></p>
                    <p
                      class="placeholder"
                      x-show="featuredCanvas === 'interaction' && thumbnails.interaction === ''"
                      x-text="t('allGrid.nothingDrawnYet')"
                    ></p>
                  </div>
                  <div
                    class="all-cell"
                    data-view="process"
                    :class="{ dimmed: featuredCanvas === 'process' }"
                    @click="canvasMode === 'editing' ? setView('process') : toggleZoom('process')"
                  >
                    <h3 x-text="t('canvas.process')"></h3>
                    <div class="all-cell-thumbnail" x-show="thumbnails.process" x-html="thumbnails.process"></div>
                    <p class="placeholder" x-show="!thumbnails.process" x-text="t('allGrid.rendering')"></p>
                  </div>
                  <div
                    class="all-cell"
                    data-view="system"
                    :class="{ dimmed: featuredCanvas === 'system' }"
                    @click="canvasMode === 'editing' ? setView('system') : toggleZoom('system')"
                  >
                    <h3 x-text="t('canvas.systemFull')"></h3>
                    <div class="all-cell-thumbnail" x-show="thumbnails.system" x-html="thumbnails.system"></div>
                    <p class="placeholder" x-show="!thumbnails.system" x-text="t('allGrid.rendering')"></p>
                  </div>
                  <div
                    class="all-cell"
                    data-view="object"
                    :class="{ dimmed: featuredCanvas === 'object' }"
                    @click="canvasMode === 'editing' ? setView('object') : toggleZoom('object')"
                  >
                    <h3 x-text="t('canvas.object')"></h3>
                    <div class="all-cell-thumbnail" x-show="thumbnails.object" x-html="thumbnails.object"></div>
                    <p class="placeholder" x-show="!thumbnails.object" x-text="t('allGrid.rendering')"></p>
                  </div>
                  <div
                    class="all-cell"
                    data-view="interaction"
                    :class="{ dimmed: featuredCanvas === 'interaction' }"
                    @click="canvasMode === 'editing' ? setView('interaction') : toggleZoom('interaction')"
                  >
                    <h3 x-text="t('canvas.interaction')"></h3>
                    <div class="all-cell-thumbnail" x-show="thumbnails.interaction" x-html="thumbnails.interaction"></div>
                    <!-- Excalidraw's legitimate empty state (nothing drawn yet) renders as
                         '' — a real, final result, not a mid-render placeholder — so it
                         needs its own message distinct from "still rendering" (null). -->
                    <p class="placeholder" x-show="thumbnails.interaction === null" x-text="t('allGrid.rendering')"></p>
                    <p class="placeholder" x-show="thumbnails.interaction === ''" x-text="t('allGrid.nothingDrawnYet')"></p>
                  </div>
                </div>
              </template>
              <div class="process-view" x-show="activeView === 'process'" x-effect="syncProcessCanvas($el)">
                <div class="process-canvas-wrap">
                  <p class="canvas-hint" x-show="canvasMode === 'editing'" x-text="canvasHint('process')"></p>
                  <div class="process-canvas-container"></div>
                </div>
                <div class="process-properties-panel"></div>
              </div>
              <div class="canvas-view-wrap" x-show="activeView === 'system'">
                <p class="canvas-hint" x-show="canvasMode === 'editing'" x-text="canvasHint('system')"></p>
                <div class="canvas-container" x-effect="syncSystemCanvas($el)"></div>
              </div>
              <div class="canvas-view-wrap" x-show="activeView === 'interaction'">
                <p class="canvas-hint" x-show="canvasMode === 'editing'" x-text="canvasHint('interaction')"></p>
                <div class="canvas-container" x-effect="syncInteractionCanvas($el)"></div>
              </div>
              <div class="canvas-view-wrap" x-show="activeView === 'object'">
                <p class="canvas-hint" x-show="canvasMode === 'editing'" x-text="canvasHint('object')"></p>
                <div class="canvas-container" x-effect="syncObjectCanvas($el)"></div>
              </div>

              <div class="history-panel" x-show="historyOpen">
                <div class="history-panel-header">
                  <h3 x-text="t('history.title')"></h3>
                  <button type="button" class="history-close" @click="toggleHistory()">×</button>
                </div>
                <p
                  class="copy-provenance"
                  x-show="activeIssue && activeIssue.views[activeView] && activeIssue.views[activeView].copiedFrom"
                  x-text="activeIssue && activeIssue.views[activeView] && activeIssue.views[activeView].copiedFrom ? t('history.copiedFromEarlierVersion') : ''"
                  :title="activeIssue && activeIssue.views[activeView] ? copyProvenanceLabel(activeIssue.views[activeView].copiedFrom) : ''"
                ></p>
                <ul class="history-list">
                  <template x-for="entry in historyEntries" :key="entry.oid">
                    <li class="history-entry">
                      <p class="history-message" x-text="entry.message"></p>
                      <p class="history-date" x-text="new Date(entry.timestamp * 1000).toLocaleString()"></p>
                      <button type="button" class="history-restore" @click="restoreHistoryEntry(entry.oid)" x-text="t('history.restore')">
                      </button>
                    </li>
                  </template>
                  <li class="history-empty" x-show="historyEntries.length === 0" x-text="t('history.noHistoryYet')"></li>
                </ul>
              </div>
            </div>
          </main>
        </div>

        <!-- Issue-picker overlay (ADR-0017), replacing the old persistent sidebar.
             Shown automatically whenever nothing's selected (no close button in
             that state — same forced-selection behavior as before), or on demand
             via the burger menu's "Change Issue" while an Issue is already active. -->
        <div class="issue-picker-backdrop" x-show="showIssuePicker" x-cloak></div>
        <div class="issue-picker" x-show="showIssuePicker" x-cloak>
          <div class="issue-picker-header">
            <h2 x-text="t('issuePicker.title')"></h2>
            <button type="button" class="close" @click="closeIssuePicker()" x-show="activeIssue">×</button>
          </div>
          <div class="issue-picker-body">
            <input
              type="search"
              class="sidebar-search"
              :placeholder="t('issuePicker.searchPlaceholder')"
              x-model="issuePickerQuery"
            />
            <button type="button" class="new-issue-button" @click="createNewIssue()" x-text="t('issuePicker.newIssue')"></button>
            <ul class="issue-list">
              <template x-for="issue in filteredIssues" :key="issue.id">
                <li>
                  <button
                    type="button"
                    class="issue-item"
                    :class="{ active: issue.id === activeIssueId }"
                    :title="issue.name"
                    @click="selectIssue(issue.id)"
                  >
                    <span class="issue-title" x-text="issue.name"></span>
                    <span class="issue-meta">
                      <span class="issue-state" :class="'state-' + issue.status" x-text="t('status.' + issue.status)"></span>
                    </span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </div>

        <!-- Settings overlay (ADR-0017) — mock only, no real settings surface yet. -->
        <div class="settings-backdrop" x-show="settingsOpen" @click="closeSettings()" x-cloak></div>
        <div class="settings-overlay" x-show="settingsOpen" x-cloak>
          <div class="issue-picker-header">
            <h2 x-text="t('settings.title')"></h2>
            <button type="button" class="close" @click="closeSettings()">×</button>
          </div>
          <div class="settings-body">
            <p class="settings-placeholder" x-text="t('settings.placeholder')"></p>
            <div class="settings-mock-row">
              <span x-text="t('settings.notifications')"></span>
              <span class="settings-mock-tag" x-text="t('settings.comingSoon')"></span>
            </div>
            <div class="settings-mock-row">
              <span x-text="t('settings.workspace')"></span>
              <span class="settings-mock-tag" x-text="t('settings.comingSoon')"></span>
            </div>
          </div>
        </div>

        <!-- How To overlay (ADR-0035) — one overlay, two entry points.
             howToView === null: general concepts, opened from the burger menu.
             howToView === a canvas name: that canvas's own editing basics,
             opened from the per-canvas button next to Copy/History/Export. -->
        <div class="howto-backdrop" x-show="howToOpen" @click="closeHowTo()" x-cloak></div>
        <div class="howto-overlay" x-show="howToOpen" x-cloak>
          <div class="issue-picker-header">
            <h2 x-text="howToView ? t('canvas.' + howToView) : t('howTo.general.title')"></h2>
            <button type="button" class="close" @click="closeHowTo()">×</button>
          </div>
          <div class="howto-body">
            <template x-if="!howToView">
              <div>
                <div class="howto-section">
                  <h3 x-text="t('howTo.general.whatItIs.title')"></h3>
                  <p x-text="t('howTo.general.whatItIs.body')"></p>
                </div>
                <div class="howto-section">
                  <h3 x-text="t('howTo.general.issues.title')"></h3>
                  <p x-text="t('howTo.general.issues.body')"></p>
                </div>
                <div class="howto-section">
                  <h3 x-text="t('howTo.general.canvases.title')"></h3>
                  <ul class="howto-list">
                    <li x-text="t('howTo.general.canvases.process')"></li>
                    <li x-text="t('howTo.general.canvases.system')"></li>
                    <li x-text="t('howTo.general.canvases.object')"></li>
                    <li x-text="t('howTo.general.canvases.interaction')"></li>
                  </ul>
                </div>
                <div class="howto-section">
                  <h3 x-text="t('howTo.general.backlog.title')"></h3>
                  <p x-text="t('howTo.general.backlog.body')"></p>
                </div>
                <div class="howto-section">
                  <h3 x-text="t('howTo.general.modes.title')"></h3>
                  <p x-text="t('howTo.general.modes.body')"></p>
                </div>
                <div class="howto-section">
                  <h3 x-text="t('howTo.general.copy.title')"></h3>
                  <p x-text="t('howTo.general.copy.body')"></p>
                </div>
                <div class="howto-section">
                  <h3 x-text="t('howTo.general.history.title')"></h3>
                  <p x-text="t('howTo.general.history.body')"></p>
                </div>
                <div class="howto-section">
                  <h3 x-text="t('howTo.general.export.title')"></h3>
                  <p x-text="t('howTo.general.export.body')"></p>
                </div>
              </div>
            </template>
            <template x-if="howToView">
              <div class="howto-section">
                <ul class="howto-list">
                  <template x-for="step in howToCanvasSteps()" :key="step">
                    <li x-text="step"></li>
                  </template>
                </ul>
                <a class="howto-link" :href="howToCanvasLink()" target="_blank" rel="noopener" x-text="t('howTo.learnMore')"></a>
              </div>
            </template>
          </div>
        </div>

      </div>

      <div class="copy-picker-backdrop" x-show="copyPickerOpen" @click="closeCopyPicker()"></div>
      <div class="copy-picker" x-show="copyPickerOpen">
        <div class="history-panel-header">
          <h3 x-text="copyPickerMode === 'view' ? t('copyPicker.copyViewFrom', { view: t('canvas.' + activeView) }) : t('copyPicker.copyEntryFrom')"></h3>
          <button type="button" class="history-close" @click="closeCopyPicker()">×</button>
        </div>
        <div class="copy-picker-body">
          <label class="copy-picker-label" x-text="t('copyPicker.sourceIssue')"></label>
          <select class="backlog-field" x-model="copySourceId">
            <option value="" x-text="t('copyPicker.selectIssue')"></option>
            <template x-for="issue in copySourceOptions" :key="issue.id">
              <option :value="issue.id" x-text="issue.name"></option>
            </template>
          </select>

          <template x-if="copyPickerMode === 'entry' && copySourceId">
            <div>
              <label class="copy-picker-label" x-text="t('copyPicker.entry')"></label>
              <select class="backlog-field" x-model="copySourceEntryId">
                <option value="" x-text="t('copyPicker.selectEntry')"></option>
                <template x-for="entry in copySourceEntries" :key="entry.id">
                  <option :value="entry.id" x-text="entry.name"></option>
                </template>
              </select>
            </div>
          </template>

          <p class="copy-picker-note" x-show="copyPickerMode === 'view'" x-text="t('copyPicker.overwriteNote')"></p>
          <p class="copy-picker-note" x-show="copyPickerMode === 'entry'" x-text="t('copyPicker.appendNote')"></p>

          <button
            type="button"
            class="history-restore"
            :disabled="!copySourceId || (copyPickerMode === 'entry' && !copySourceEntryId)"
            @click="performCopy()"
            x-text="t('copyPicker.copy')"
          ></button>
        </div>
      </div>

      <div class="copy-picker-backdrop" x-show="exportPickerOpen" @click="closeExportPicker()"></div>
      <div class="copy-picker" x-show="exportPickerOpen">
        <div class="history-panel-header">
          <h3 x-text="t('exportPicker.title', { view: t('canvas.' + activeView) })"></h3>
          <button type="button" class="history-close" @click="closeExportPicker()">×</button>
        </div>
        <div class="copy-picker-body">
          <label class="copy-picker-label" x-text="t('exportPicker.format')"></label>
          <select class="backlog-field" x-model="exportFormat">
            <option value="native" x-text="activeView !== 'all' ? exportNativeFormats[activeView].label : ''"></option>
            <option value="svg">SVG</option>
            <option value="png">PNG</option>
          </select>

          <div class="export-picker-actions">
            <button type="button" class="copy-toggle" @click="performExportCopy()" x-text="t('copyPicker.copy')"></button>
            <button type="button" class="history-restore" @click="performExport()" x-text="t('exportPicker.download')"></button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
